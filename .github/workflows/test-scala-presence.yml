name: Test Scala Presence

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  test-scala-presence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Check for scala imports in Java
        run: |
          if grep -RIn --include='*.java' -F "import scala." src/main/java; then
            echo "Found 'import scala.' in Java sources."
            exit 1
          fi
